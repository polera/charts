apiVersion: v2
name: clickhouse
description: >-
  Bootstrap an optionally highly-available ClickHouse cluster using the official
  ClickHouse image, including admin account, databases, application users and
  scheduled backup CronJobs.
type: application
# Chart version — bump on every change to the chart itself.
version: 0.4.0
# Default application version — used as the image tag when image.tag is empty.
# Pin this to a ClickHouse release you have validated.
appVersion: "26.3"
home: https://clickhouse.com
sources:
  - https://hub.docker.com/_/clickhouse
  - https://github.com/ClickHouse/ClickHouse
keywords:
  - clickhouse
  - database
  - olap
  - analytics
  - high-availability
maintainers:
  - name: James Polera
    email: james@netdot.org
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Bump default appVersion to ClickHouse 26.3 (current LTS, replacing the older 24.8 LTS line).
