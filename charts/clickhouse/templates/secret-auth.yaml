{{- if not .Values.auth.existingSecret }}
{{- /*
  Generate and persist credentials. On upgrade we look up the existing secret
  and reuse any already-stored value so passwords stay stable.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-auth" (include "clickhouse.fullname" .))) -}}
{{- $data := (and $existing $existing.data) | default dict -}}
{{- $admin := .Values.auth.admin.password | default (index $data "admin-password" | default "" | b64dec) | default (randAlphaNum 24) -}}
{{- $default := .Values.auth.defaultUser.password | default (index $data "default-password" | default "" | b64dec) | default (randAlphaNum 24) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.fullname" . }}-auth
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  default-password: {{ $default | b64enc | quote }}
  {{- range .Values.users }}
  {{- $key := printf "user-%s-password" .name }}
  {{- $pw := .password | default (index $data $key | default "" | b64dec) | default (randAlphaNum 20) }}
  {{ $key }}: {{ $pw | b64enc | quote }}
  {{- end }}
{{- end }}
